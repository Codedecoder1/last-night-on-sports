name: Daily episode

on:
  schedule:
    - cron: "0 9 * * *"    # 09:00 UTC = 1 AM Pacific in winter (2 AM in summer)
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      date:
        description: "Game date YYYY-MM-DD (blank = yesterday)"
        required: false

permissions:
  contents: write

concurrency: daily-episode

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if today's episode already exists
        id: check
        run: |
          if [ -z "${{ inputs.date }}" ] && [ -f "episodes/$(date -u +%F).mp3" ]; then
            echo "Episode for $(date -u +%F) already published - skipping (no cost)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Make episode
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch .env
          python -u episode.py ${{ inputs.date }}
      - name: Convert to MP3
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          for f in episodes/*.wav; do
            ffmpeg -y -loglevel error -i "$f" -codec:a libmp3lame -b:a 96k "${f%.wav}.mp3"
          done
      - name: Update podcast feed
        if: steps.check.outputs.skip != 'true'
        run: python feed.py
      - name: Save episode to repo
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Last Night on Sports bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/*.mp3 episodes/*.txt episodes/*.json feed.xml
          git commit -m "Episode $(date -u +%F)" || echo "nothing new"
          git push
