name: Daily episode

on:
  schedule:
    # GitHub can delay or drop scheduled runs, so we try several times.
    # The first one that runs makes the episode; the rest skip at no cost.
    - cron: "17 9 * * *"   # ~1:17 AM Pacific (winter)
    - cron: "47 10 * * *"  # ~2:47 AM Pacific backup
    - cron: "17 12 * * *"  # ~4:17 AM Pacific backup
    - cron: "17 13 * * *"  # ~5:17 AM Pacific last backup
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      date:
        description: "Game date YYYY-MM-DD (blank = yesterday)"
        required: false

permissions:
  contents: write

concurrency: daily-episode

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest version, so a queued backup run sees today's episode and skips
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if today's episode already exists
        id: check
        run: |
          if [ -z "${{ inputs.date }}" ] && [ -f "episodes/$(date -u +%F).mp3" ]; then
            echo "Episode for $(date -u +%F) already published - skipping (no cost)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Make episode
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch .env
          python -u episode.py ${{ inputs.date }}
      - name: Convert to MP3
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          for f in episodes/*.wav; do
            ffmpeg -y -loglevel error -i "$f" -codec:a libmp3lame -b:a 96k "${f%.wav}.mp3"
          done
      - name: Update podcast feed
        if: steps.check.outputs.skip != 'true'
        run: python feed.py
      - name: Save episode to repo
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Last Night on Sports bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/*.mp3 episodes/*.txt episodes/*.json feed.xml
          git commit -m "Episode $(date -u +%F)" || echo "nothing new"
          git pull --rebase -q origin main
          git push
